name: Radyo Listelerini Güncelle

on:
  schedule:
    - cron: '0 3 * * 1'   # Her Pazartesi 03:00 UTC
  workflow_dispatch:        # Elle de tetiklenebilir (Actions sekmesinden "Run workflow")

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      # Buraya kaç ülke varsa o kadar satır eklenir.
      - name: Fetch country lists
        run: |
          python fetch_country.py TR Turkey
          # python fetch_country.py DE Germany
          # python fetch_country.py US "United States"

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add countries/
          git diff --quiet --cached || git commit -m "chore: otomatik radyo listesi güncellemesi"
          git push
